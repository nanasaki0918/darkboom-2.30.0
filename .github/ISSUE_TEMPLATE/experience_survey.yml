name: 游玩体验问卷
description: 分享整体体验、游玩方式、玩法偏好和改进建议
title: "[问卷] 游玩体验反馈"
body:
  - type: markdown
    attributes:
      value: |
        本问卷面向《黑潮：深海觉醒》2.30.0玩家修复版，约需3分钟。
        需要登录GitHub；提交后会成为公开的Issue，其他人也能看到回答。
        请按实际体验填写，未体验的内容可跳过；不需要填写真实姓名、手机号或账号密码。
        安装、启动或具体功能异常，请优先使用[安装表单](https://github.com/nanasaki0918/darkboom-2.30.0/issues/new?template=installation.yml)或[Bug表单](https://github.com/nanasaki0918/darkboom-2.30.0/issues/new?template=bug_report.yml)。
  - type: input
    id: version
    attributes:
      label: 游戏修复版本
      description: 填写登录页修复版本标识；找不到可写“不清楚”。
      placeholder: "2.30.0 / 修复版本标识"
    validations:
      required: true
  - type: dropdown
    id: duration
    attributes:
      label: 已体验时长
      options:
        - 尚未进入游戏
        - 不满1小时
        - 1至5小时
        - 5至20小时
        - 20小时以上
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 主要游玩方式
      options:
        - Admin全角色收藏档
        - 新注册账号：适度体验的初始邮件
        - 新注册账号：无需肝的全开邮件
        - 两种或多种方式都有体验
        - 尚未选择或不清楚
    validations:
      required: true
  - type: dropdown
    id: satisfaction
    attributes:
      label: 整体体验满意度
      options:
        - 1分：很不满意
        - 2分：不满意
        - 3分：一般
        - 4分：满意
        - 5分：很满意
        - 尚未体验，暂不评价
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 运行环境
      options:
        - MuMu模拟器
        - 雷电模拟器
        - 其他模拟器
        - 安卓实体设备
  - type: dropdown
    id: interests
    attributes:
      label: 最感兴趣的内容
      description: 可多选；只选择实际感兴趣的内容。
      multiple: true
      options:
        - 全角色收藏与招募
        - 角色养成与阵容搭配
        - 主线剧情与副本战斗
        - 高难挑战
        - 大型活动与活动剧情
        - 活动小游戏
        - 后宅与家具布置
        - 日语／繁中内容切换
        - 角色语音与音乐
        - 轻松怀旧与自由体验
  - type: dropdown
    id: progression
    attributes:
      label: 新账号成长与资源节奏
      description: 结合初始／全开邮件、升级奖励和指挥官经验倍率评价；使用收藏档或未充分体验时可选择暂不评价。
      options:
        - 太慢，资源不足或日常负担偏大
        - 略慢，部分阶段推进吃力
        - 基本合适
        - 略快，希望有更多成长目标
        - 太快，容易缺少长期目标
        - 未体验新账号，暂不评价
  - type: dropdown
    id: recruitment
    attributes:
      label: 招募与角色获取体验
      description: 结合当前卡池开放范围和UP规则，按实际体验评价。
      options:
        - 获取偏难，难以得到想要的角色
        - 略难，希望获取更轻松
        - 基本合适
        - 略容易，希望保留更多收集过程
        - 太容易，收集目标很快结束
        - 尚未体验或不适用
  - type: dropdown
    id: priorities
    attributes:
      label: 希望优先改进的方向
      description: 可多选，建议选最重要的1至3项。
      multiple: true
      options:
        - 安装、更新与启动流程
        - 稳定性、卡死或闪退
        - 主线、副本与战斗体验
        - 大型活动完整度
        - 活动小游戏
        - 新账号成长与邮件奖励
        - 招募、角色收集与养成
        - 后宅与家具功能
        - 日语／繁中切换及文本
        - 角色语音与音乐
        - 说明、引导与操作便利性
        - 暂无明显改进需求
  - type: textarea
    id: obstacle
    attributes:
      label: 最影响体验的一件事
      description: 选填。描述具体场景；已提交Bug时可附对应Issue链接，方便关联。
      placeholder: "在……场景中，我遇到……，这让我……"
  - type: textarea
    id: suggestions
    attributes:
      label: 其他建议或想保留的内容
      description: 选填。可以写希望新增、调整或保留的体验。
